name: "ETF ID/NR4 Scanner (Multi-ETF)"

on:
  schedule:
    - cron: '30 13 * * 1-5'  # Orario di esecuzione programmata (Lun-Ven)
  workflow_dispatch:        # Consente l'avvio manuale (tasto Run workflow)

jobs:
  run-etf-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas alpaca-py requests

      - name: Run ETF Scanner Script
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python scanner_idnr4.py
