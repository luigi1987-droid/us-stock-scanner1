name: US Stock ID/NR4 Scanner

on:
  schedule:
    # Esegue dal lunedì al venerdì alle 22:30 UTC (dopo la chiusura di Wall Street)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Per lanciarlo a mano quando vuoi

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner script
        run: python scanner_idnr4.py
