name: Alpaca ETF Trading Bot

on:
  schedule:
    # Esegue dal lunedì al venerdì alle 14:30 UTC (durante l'orario di apertura di Wall Street)
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Permette l'avvio manuale dalla tab Actions di GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas alpaca-py

      - name: Run Trading Bot
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python scanner_etf_idnr4.py

      - name: Commit execution summary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add execution_summary.txt
          git commit -m "Aggiornato report esecuzione bot [skip ci]" || exit 0
          git push
