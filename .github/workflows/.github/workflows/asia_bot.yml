name: "Asia ID/NR4 Bot (ADRs & ETFs)"

on:
  schedule:
    - cron: '15 22 * * 1-5'  # Orario di esecuzione a fine seduta US
  workflow_dispatch:

jobs:
  run-asia-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas alpaca-py requests

      - name: Run Asia Scanner Script
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python scanner_asia.py
